name: Publish due notes

on:
  schedule:
    # 05:30 UTC = 11:00 IST, so a note goes out during the day it is dated.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be published, without merging
        type: boolean
        default: false
      date:
        description: Treat this date as today (YYYY-MM-DD, UTC)
        type: string
        required: false
      max:
        description: Maximum notes to publish in this run
        type: number
        default: 10

# Merge needs contents + pull-requests. actions: write is for dispatching the
# deploy workflow, because GITHUB_TOKEN merges do not trigger push workflows.
permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: publish-notes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TODAY: ${{ github.event.inputs.date }}
          MAX_MERGES: ${{ github.event.inputs.max || '10' }}
        run: node scripts/publish-due-notes.mjs

      - name: Stop deploy dispatch if publish failed
        if: failure()
        run: |
          echo "One or more notes were skipped; see the summary above." >> "$GITHUB_STEP_SUMMARY"
